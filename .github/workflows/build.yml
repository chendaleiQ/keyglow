name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build universal app
        run: UNIVERSAL=1 ./build.sh

      - name: Verify and package
        id: package
        run: |
          set -euo pipefail
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          test -x dist/KeyGlow.app/Contents/MacOS/InputHeat
          plutil -lint dist/KeyGlow.app/Contents/Info.plist
          codesign --verify --deep --strict --verbose=2 dist/KeyGlow.app
          lipo -archs dist/KeyGlow.app/Contents/MacOS/InputHeat
          ditto -c -k --keepParent dist/KeyGlow.app "dist/KeyGlow-${VERSION}-macos-universal.zip"
          ls -lh dist/*.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeyGlow-macos-universal
          path: dist/KeyGlow-*-macos-universal.zip
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.package.outputs.version }}"
          if [[ "v${VERSION}" != "${GITHUB_REF_NAME}" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match app version v${VERSION}"
            exit 1
          fi
          cat > release-notes.md <<EOF
          KeyGlow ${VERSION} — macOS 13+ universal build (Apple Silicon + Intel).

          This build is ad-hoc signed and not notarized. On first launch,
          right-click KeyGlow.app and choose Open, or run:

              xattr -cr /Applications/KeyGlow.app

          KeyGlow needs Input Monitoring permission under
          System Settings › Privacy & Security › Input Monitoring.
          It never records typed text or screen content.
          EOF
          ASSET="dist/KeyGlow-${VERSION}-macos-universal.zip"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${ASSET}#KeyGlow ${VERSION} (macOS universal, ad-hoc signed)" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              "${ASSET}#KeyGlow ${VERSION} (macOS universal, ad-hoc signed)" \
              --title "KeyGlow ${GITHUB_REF_NAME}" \
              --notes-file release-notes.md
          fi
