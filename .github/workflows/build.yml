name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build universal app
        run: UNIVERSAL=1 ./build.sh

      - name: Verify and package
        id: package
        run: |
          set -euo pipefail
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Info.plist)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          test -x dist/KeyGlow.app/Contents/MacOS/InputHeat
          plutil -lint dist/KeyGlow.app/Contents/Info.plist
          codesign --verify --deep --strict --verbose=2 dist/KeyGlow.app
          lipo dist/KeyGlow.app/Contents/MacOS/InputHeat -verify_arch arm64
          lipo dist/KeyGlow.app/Contents/MacOS/InputHeat -verify_arch x86_64
          test -f dist/KeyGlow.app/Contents/Resources/dashboard.js
          test -f dist/KeyGlow.app/Contents/Resources/dashboard.css
          ./package.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeyGlow-macos-universal
          path: |
            dist/KeyGlow-*-macos-universal.dmg
            dist/KeyGlow-*-macos-universal.dmg.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: keyglow-release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare version release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import plistlib; print(plistlib.load(open("Info.plist", "rb"))["CFBundleShortVersionString"])')
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Invalid app version: $VERSION"; exit 1; }
          TAG="v${VERSION}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "$TAG" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app version $TAG"
            exit 1
          fi
          if DRAFT=$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [[ "$DRAFT" == false ]]; then
              echo "Release $TAG already published; bump Info.plist for the next release." >> "$GITHUB_STEP_SUMMARY"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            if [[ "$(git rev-parse "$TAG^{commit}")" != "$GITHUB_SHA" ]]; then
              echo "::error::Existing tag $TAG points to another commit; refusing to replace it."
              exit 1
            fi
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Download universal build
        if: steps.version.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: KeyGlow-macos-universal
          path: dist

      - name: Publish GitHub Release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          TAG="${{ steps.version.outputs.tag }}"
          cat > release-notes.md <<EOF
          KeyGlow ${VERSION} — macOS 13+ (Apple Silicon + Intel).

          Open the DMG and drag KeyGlow.app to the Applications folder.
          This build is ad-hoc signed and not notarized. macOS may require
          System Settings → Privacy & Security → Open Anyway on first launch.

          Enable Input Monitoring in System Settings → Privacy & Security.
          English and Simplified Chinese follow your device language by default.
          Only activity counts and pointer grids are stored locally.
          EOF
          ASSET="dist/KeyGlow-${VERSION}-macos-universal.dmg"
          (cd dist && shasum -a 256 -c "KeyGlow-${VERSION}-macos-universal.dmg.sha256")
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" "${ASSET}.sha256" --clobber
            gh release edit "$TAG" --draft=false --title "KeyGlow $TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" "$ASSET" "${ASSET}.sha256" \
              --target "$GITHUB_SHA" \
              --title "KeyGlow $TAG" \
              --notes-file release-notes.md
          fi
